<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 400" role="img" aria-label="A bag of surplus food travelling from a restaurant to a food bank on a map">
  <!-- Soft backdrop -->
  <ellipse cx="240" cy="210" rx="230" ry="185" fill="#E6F2EC"/>

  <!-- Map card -->
  <rect x="44" y="58" width="392" height="276" rx="28" fill="#FFFFFF" stroke="#E8E2D8" stroke-width="2"/>
  <g stroke="#F1ECE3" stroke-width="10" stroke-linecap="round" fill="none">
    <path d="M60 140h360"/>
    <path d="M60 250h360"/>
    <path d="M150 70v252"/>
    <path d="M320 70v252"/>
  </g>
  <rect x="345" y="85" width="70" height="40" rx="10" fill="#E6F2EC"/>
  <rect x="70" y="268" width="62" height="46" rx="10" fill="#E6F2EC"/>

  <!-- Route -->
  <path d="M112 128C150 200 300 120 352 232" fill="none" stroke="#F08A24" stroke-width="5" stroke-linecap="round" stroke-dasharray="2 12"/>

  <!-- Restaurant -->
  <g transform="translate(78 78)">
    <rect x="4" y="22" width="60" height="44" rx="6" fill="#FFFFFF" stroke="#0F4A32" stroke-width="3"/>
    <path d="M0 10h68l-4 16H4Z" fill="#F08A24"/>
    <path d="M17 10l-3 16M34 10v16M51 10l3 16" stroke="#FFFFFF" stroke-width="5"/>
    <rect x="25" y="40" width="18" height="26" rx="3" fill="#1B6B4A"/>
    <rect x="0" y="4" width="68" height="8" rx="4" fill="#0F4A32"/>
  </g>

  <!-- Food bank -->
  <g transform="translate(318 198)">
    <path d="M34 0 70 24v44H-2V24Z" fill="#FFFFFF" stroke="#0F4A32" stroke-width="3" stroke-linejoin="round"/>
    <path d="M34 50c-9-7-15-12-15-18a7 7 0 0 1 15-3 7 7 0 0 1 15 3c0 6-6 11-15 18Z" fill="#F08A24"/>
  </g>

  <!-- Location pin over the food bank -->
  <g transform="translate(338 150)">
    <path d="M14 0a14 14 0 0 1 14 14c0 11-14 24-14 24S0 25 0 14A14 14 0 0 1 14 0Z" fill="#1B6B4A"/>
    <circle cx="14" cy="14" r="5" fill="#FFFFFF"/>
  </g>

  <!-- Bag of food -->
  <g transform="translate(180 150)">
    <!-- greens and bread -->
    <path d="M38 32C30 6 44-6 52 2c-2 12-4 22-6 30Z" fill="#1B6B4A"/>
    <path d="M58 32C62 8 80 0 86 8c-6 10-12 18-18 24Z" fill="#2E8B62"/>
    <rect x="66" y="-14" width="16" height="56" rx="8" transform="rotate(18 74 14)" fill="#E9B872" stroke="#B5803F" stroke-width="2"/>
    <circle cx="28" cy="26" r="11" fill="#F08A24"/>
    <!-- bag -->
    <path d="M8 30h104l-8 120a8 8 0 0 1-8 7H24a8 8 0 0 1-8-7Z" fill="#E7C796"/>
    <path d="M8 30h104l-2 18H10Z" fill="#D9B27A"/>
    <!-- drop badge -->
    <g transform="translate(40 70)">
      <path d="M20 0S2 19 2 30a18 18 0 0 0 36 0C38 19 20 0 20 0Z" fill="#1B6B4A"/>
      <path d="M10 30h20a10 10 0 0 1-20 0Z" fill="#FFFFFF"/>
    </g>
  </g>

  <!-- Sparkles -->
  <g fill="#F08A24">
    <circle cx="70" cy="40" r="5"/>
    <circle cx="440" cy="330" r="6"/>
    <circle cx="455" cy="70" r="4"/>
  </g>
</svg>
